<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MozgAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 56px;
      background: radial-gradient(circle at center, #8c94a1 0%, #757f90 20%, #4a5261 42%, #1b1f27 58%, #000000 68%, #000000 100%);
      color: white;
      padding: 24px;
    }

    .logo-wrap {
      width: min(78vw, 520px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 35%, rgba(255,255,255,0) 70%);
    }

    .logo {
      width: min(76%, 420px);
      max-width: 100%;
      filter: brightness(1.1) contrast(1.08)
              drop-shadow(0 0 32px rgba(255,255,255,0.2));
    }

    .buttons {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 22px 50px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
    }

    .btn-event {
      background: linear-gradient(135deg, #00eaff, #3b82f6);
      box-shadow: 0 0 25px rgba(0,234,255,0.4);
    }

    .btn-finance {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      box-shadow: 0 0 25px rgba(168,85,247,0.4);
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255,255,255,0.2);
    }

    .btn:active {
      transform: scale(0.97);
    }

    @media (max-width: 600px) {
      body { gap: 42px; }
      .logo-wrap { width: min(88vw, 420px); }
      .btn { width: 100%; text-align: center; }
    }
  </style>
</head>

<body>

  <!-- Put your logo file in the same folder as this HTML and name it logo.png -->
  <div class="logo-wrap">
    <img src="logo.png" class="logo" alt="MozgAI">
  </div>

  <div class="buttons">
    <button class="btn btn-event" onclick="goTo('event')">EventOrg</button>
    <button class="btn btn-finance" onclick="goTo('finance')">Household Finance</button>
  </div>

  <script>
    const EVENTORG_URL = "https://webapp-usq6.vercel.app/";
    const HOUSEHOLD_FINANCE_URL = "https://household-assistant-tawny.vercel.app/login";

    function goTo(type) {
      if (type === 'event') {
        window.location.href = EVENTORG_URL;
      } else {
        window.location.href = HOUSEHOLD_FINANCE_URL;
      }
    }
  </script>

</body>
</html>
